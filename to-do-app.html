<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  h1 {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #f39c12;
    margin-bottom: 20px;
    font-size: 26px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #task-input {
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: #16213e;
    color: #eee;
    font-size: 15px;
    outline: none;
    box-shadow: 0 0 8px rgba(243, 156, 18, 0.15);
  }
  #task-input::placeholder { color: #7a86a8; }
  #add-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #f39c12;
    color: #1a1a2e;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
  }
  #add-btn:hover { background: #e08e0b; }
  .filters {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .filter-btn {
    padding: 6px 14px;
    border: 1px solid #334;
    border-radius: 20px;
    background: transparent;
    color: #9aa5c4;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
  }
  .filter-btn.active {
    background: #f39c12;
    color: #1a1a2e;
    border-color: #f39c12;
    font-weight: bold;
  }
  #task-list {
    list-style: none;
    margin-bottom: 16px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #16213e;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 8px;
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.25);
    animation: slide-in 0.2s ease;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #f39c12;
    cursor: pointer;
    flex-shrink: 0;
  }
  .task .text {
    flex: 1;
    word-break: break-word;
    font-size: 15px;
  }
  .task.done .text {
    text-decoration: line-through;
    color: #7a86a8;
  }
  .task .edit-btn {
    border: none;
    background: transparent;
    color: #7a86a8;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
    padding: 0 2px;
  }
  .task .edit-btn:hover { color: #f39c12; }
  .task .delete-btn {
    border: none;
    background: transparent;
    color: #7a86a8;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
  }
  .task .delete-btn:hover { color: #e74c3c; }
  .task .text-input {
    flex: 1;
    background: #0f3460;
    border: 1px solid #f39c12;
    border-radius: 6px;
    color: #eee;
    font-size: 15px;
    padding: 4px 8px;
    outline: none;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #7a86a8;
  }
  #clear-btn {
    border: none;
    background: none;
    color: #7a86a8;
    font-size: 13px;
    cursor: pointer;
  }
  #clear-btn:hover { color: #e74c3c; }
  .empty {
    text-align: center;
    color: #7a86a8;
    padding: 30px 0;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>To-Do List</h1>
  <div class="input-row">
    <input id="task-input" type="text" placeholder="Add a new task..." autocomplete="off">
    <button id="add-btn">Add</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Done</button>
  </div>
  <ul id="task-list"></ul>
  <div class="footer">
    <span id="count">0 tasks</span>
    <button id="clear-btn">Clear completed</button>
  </div>
</div>
<script>
  const input = document.getElementById('task-input');
  const addBtn = document.getElementById('add-btn');
  const list = document.getElementById('task-list');
  const count = document.getElementById('count');
  const clearBtn = document.getElementById('clear-btn');
  const filterBtns = document.querySelectorAll('.filter-btn');
  let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
  let currentFilter = 'all';

  function save() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function render() {
    list.innerHTML = '';
    const visible = tasks.filter((t) => {
      if (currentFilter === 'active') return !t.done;
      if (currentFilter === 'done') return t.done;
      return true;
    });
    if (visible.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No tasks here yet.';
      list.appendChild(li);
    } else {
      visible.forEach((task) => {
        const li = document.createElement('li');
        li.className = 'task' + (task.done ? ' done' : '');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', () => {
          task.done = checkbox.checked;
          save();
          render();
        });
        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = task.text;
        const edit = document.createElement('button');
        edit.className = 'edit-btn';
        edit.textContent = '\u270e';
        edit.title = 'Edit task';
        edit.addEventListener('click', () => startEdit(li, span, edit, task));
        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '\u00d7';
        del.addEventListener('click', () => {
          tasks = tasks.filter((t) => t !== task);
          save();
          render();
        });
        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(edit);
        li.appendChild(del);
        list.appendChild(li);
      });
    }
    const remaining = tasks.filter((t) => !t.done).length;
    count.textContent = remaining + ' task' + (remaining === 1 ? '' : 's') + ' left';
  }

  function addTask() {
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ text, done: false });
    input.value = '';
    save();
    render();
  }

  function startEdit(li, span, edit, task) {
    const input = document.createElement('input');
    input.className = 'text-input';
    input.type = 'text';
    input.value = task.text;
    li.replaceChild(input, span);
    edit.style.display = 'none';
    let finished = false;
    const finish = (saveIt) => {
      if (finished) return;
      finished = true;
      const text = input.value.trim();
      if (saveIt && text) {
        task.text = text;
        save();
      }
      render();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { finish(true); e.stopPropagation(); }
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
    input.focus();
    input.select();
  }

  addBtn.addEventListener('click', addTask);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });
  clearBtn.addEventListener('click', () => {
    tasks = tasks.filter((t) => !t.done);
    save();
    render();
  });
  filterBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      filterBtns.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  render();
</script>
</body>
</html>
